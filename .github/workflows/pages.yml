# Builds the static app and publishes it to GitHub Pages on every push to main.
# Needs Settings > Pages > Source set to "GitHub Actions" (and a public repo on
# the free plan). The Supabase URL and publishable key are meant to be public:
# row-level security in the database is what keeps client data private, and it
# shows nothing to anyone who isn't signed in with an invited account.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://afwezsbaccehhukrqowu.supabase.co
      NEXT_PUBLIC_SUPABASE_KEY: sb_publishable_mfCAYjBe4xfF_NOajRfiDQ_noTHDqLt
      # The site lives at /<repo name>/, so it follows a rename.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
